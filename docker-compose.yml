version: '3.9'

services:
  # ===== PostgreSQL Database =====
  postgres:
    image: postgres:16-alpine
    container_name: arogya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arogya_setu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arogya_secure_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arogya_network

  # ===== Redis Cache =====
  redis:
    image: redis:7-alpine
    container_name: arogya_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-arogya_redis_2024}
    volumes:
      - redis_data:/data
    networks:
      - arogya_network

  # ===== Backend API =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arogya_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-arogya_secure_2024}@postgres:5432/arogya_setu
      REDIS_URL: redis://:${REDIS_PASSWORD:-arogya_redis_2024}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # IBM Watson credentials
      IBM_WATSONX_URL: ${IBM_WATSONX_URL}
      IBM_WATSONX_API_KEY: ${IBM_WATSONX_API_KEY}
      IBM_WATSONX_PROJECT_ID: ${IBM_WATSONX_PROJECT_ID}
      IBM_STT_API_KEY: ${IBM_STT_API_KEY}
      IBM_STT_URL: ${IBM_STT_URL}
      IBM_TTS_API_KEY: ${IBM_TTS_API_KEY}
      IBM_TTS_URL: ${IBM_TTS_URL}
      IBM_COS_API_KEY: ${IBM_COS_API_KEY}
      IBM_COS_ENDPOINT: ${IBM_COS_ENDPOINT}
      IBM_COS_BUCKET: ${IBM_COS_BUCKET:-arogya-setu-files}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - arogya_network
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  # ===== Frontend =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arogya_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://backend:5000}
      BACKEND_URL: http://backend:5000
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY}
    depends_on:
      - backend
    networks:
      - arogya_network

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: arogya_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - arogya_network

volumes:
  postgres_data:
  redis_data:

networks:
  arogya_network:
    driver: bridge
